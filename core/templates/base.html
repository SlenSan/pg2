<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Canigo{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">🐾 Canigo</a>
      {% if request.session.id_usuario %}
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link text-white" href="{% url 'mascotas:lista' %}">Mis mascotas</a>
        <a class="nav-link text-white" href="{% url 'paseos:lista_disponibles' %}">Paseadores disponibles</a>
        <a class="nav-link text-white" href="{% url 'paseos:mis_paseos' %}">Mis paseos</a>
        <a class="nav-link text-white" href="{% url 'usuarios:logout' %}">Cerrar sesión</a>
      </div>
      {% endif %}
    </div>
  </nav>

  <main class="container py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
