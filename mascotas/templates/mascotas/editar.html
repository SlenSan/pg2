{% extends "base.html" %}

{% block title %}Editar {{ mascota.nombre }} — Canigo{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">Editar mascota</h1>
        <form method="post" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          {% include "mascotas/_formulario.html" with foto_actual=mascota.foto %}
          <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
        </form>
        <p class="mt-3 mb-0 text-center">
          <a href="{% url 'mascotas:lista' %}">Volver a mis mascotas</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const inputFoto = document.getElementById('id_foto');
  const vistaPrevia = document.getElementById('vista-previa-foto');
  if (inputFoto && vistaPrevia) {
    inputFoto.addEventListener('change', function () {
      const archivo = inputFoto.files[0];
      if (archivo) {
        vistaPrevia.src = URL.createObjectURL(archivo);
        vistaPrevia.classList.remove('d-none');
      } else {
        vistaPrevia.classList.add('d-none');
      }
    });
  }
</script>
{% endblock %}
