{% extends "base.html" %}

{% block title %}¡Gracias! — Canigo{% endblock %}

{% block extra_head %}
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="text-center py-4">
      <div
        class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
        style="width: 96px; height: 96px; background-color: var(--color-accent); color: #FFFFFF; font-size: 3rem;"
      >
        <i class="bi bi-check-lg"></i>
      </div>
      <h1 class="h4 mb-2">¡Gracias por tu calificación!</h1>
      <p class="text-muted mb-4">Tu opinión ayuda a otros dueños a elegir mejor paseador.</p>
      <a href="{% url 'usuarios:bienvenida' %}" class="btn btn-primary w-100">Volver al inicio</a>
    </div>
  </div>
</div>
{% endblock %}
