{% extends "base.html" %}

{% block title %}Paseos activos — Canigo{% endblock %}

{% block content %}
<h1 class="h4 mb-4">Paseos activos</h1>

<div id="aviso-paseos-activos"></div>
<div id="lista-paseos-activos">
  {% include "paseos/_lista_paseos_activos.html" %}
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  // RNF2 (actualizar ubicacion/estado en intervalos <=10s): esta pantalla
  // no tenia ningun sondeo antes - el dueño no se enteraba de que el
  // paseador inicio/finalizo un paseo hasta recargar. Mismo patron de
  // render_to_string + reemplazo de innerHTML que ya usa
  // estado_bienvenida_paseador() en usuarios/bienvenida_paseador.html,
  // porque la lista cambia de estructura (badge, boton "Ver mapa"), no
  // solo de texto suelto.
  var contenedor = document.getElementById('lista-paseos-activos');
  var urlEstado = "{% url 'paseos:estado_mis_paseos' %}";
  var intervaloId = null;

  function idsActuales() {
    return Array.prototype.slice.call(contenedor.querySelectorAll('[data-id-paseo]'))
      .map(function (el) { return el.dataset.idPaseo; });
  }

  function mostrarAviso(texto) {
    var aviso = document.getElementById('aviso-paseos-activos');
    aviso.innerHTML = '<div class="alert alert-success">' + texto + '</div>';
    setTimeout(function () { aviso.innerHTML = ''; }, 6000);
  }

  function actualizar() {
    var idsAntes = idsActuales();
    fetch(urlEstado)
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        contenedor.innerHTML = data.html;
        var idsDespues = idsActuales();
        var terminaron = idsAntes.filter(function (id) { return idsDespues.indexOf(id) === -1; });
        // listar_activos_por_dueno() (mis_paseos()) solo trae
        // "disponible"/"en_vivo" - la UNICA forma en que un id sale de
        // esta lista es que el paseador lo finalizo (paso a "historico").
        if (terminaron.length > 0) {
          mostrarAviso('Un paseo finalizó. Puedes calificarlo desde el historial.');
        }
      });
  }

  function iniciarSondeo() {
    if (!intervaloId) {
      intervaloId = setInterval(actualizar, 10000);
    }
  }

  function detenerSondeo() {
    if (intervaloId) {
      clearInterval(intervaloId);
      intervaloId = null;
    }
  }

  // Pausa el sondeo con la pestaña oculta (no gasta peticiones de
  // alguien que dejo la pestaña abierta de fondo) y refresca de
  // inmediato al volver a ella, para no esperar hasta 10s mas.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      actualizar();
      iniciarSondeo();
    } else {
      detenerSondeo();
    }
  });

  if (document.visibilityState === 'visible') {
    iniciarSondeo();
  }
})();
</script>
{% endblock %}
