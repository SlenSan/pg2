services:
  - type: web
    name: canigo
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py crear_indices
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: canigo
      - key: CLOUDINARY_URL
        sync: false
