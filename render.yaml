services:
  - type: web
    name: canigo
    runtime: python
    plan: free
    region: virginia
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py crear_indices
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --worker-class gthread --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: canigo
      - key: CLOUDINARY_URL
        sync: false
      - key: CANIGO_ADMIN_EMAILS
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
